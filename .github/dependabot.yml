version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # Blocked by eslint-plugin-jsx-a11y@6.10.2 (peer eslint <= ^9)
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Blocked by @typescript-eslint/parser@8.74.0 (peer typescript <6.1.0)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Blocked by @stryker-mutator/vitest-runner@10.1.1 (peer vitest ^3.x)
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
